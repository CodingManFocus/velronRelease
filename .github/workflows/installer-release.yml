name: Installer release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['installer/**', 'install.sh', 'install.ps1', '.github/workflows/installer-release.yml']
  pull_request:
    paths: ['installer/**', 'install.sh', 'install.ps1', '.github/workflows/installer-release.yml']

permissions:
  contents: read

concurrency:
  group: installer-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check PowerShell GUI input adapter
        shell: pwsh
        run: ./tests/testPowerShellAdapter.ps1
      - run: node tests/nativeSmoke.cjs
      - run: npm run build:windows
      - name: Check packaged Windows application
        shell: pwsh
        run: |
          $env:VELRON_SMOKE_EXECUTABLE = (Resolve-Path '../dist/win-unpacked/Velron Installer.exe').Path
          node tests/nativeSmoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-checks-windows
          path: installer/test-results/

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node tests/nativeSmoke.cjs
      - run: npm run build:macos
        env:
          # package.json explicitly uses the ad-hoc identity; no certificate is loaded.
          CSC_FOR_PULL_REQUEST: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check universal application
        run: |
          bundle='../dist/mac-universal/Velron Installer.app'
          lipo "$bundle/Contents/MacOS/Velron Installer" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$bundle"
          VELRON_SMOKE_EXECUTABLE="$PWD/$bundle/Contents/MacOS/Velron Installer" node tests/nativeSmoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-checks-macos
          path: installer/test-results/

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: xvfb-run -a node tests/nativeSmoke.cjs
      - run: npm run build:linux
      - name: Check and package Linux applications
        run: |
          VELRON_SMOKE_EXECUTABLE="$PWD/../dist/linux-unpacked/velron-installer" xvfb-run -a node tests/nativeSmoke.cjs
          sh -n linux/launch.sh
          shellcheck -s sh linux/launch.sh ../install.sh
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate linux/Velron-Installer.desktop
          bundle='../build/Velron Installer'
          mkdir -p "$bundle/x64" "$bundle/arm64"
          cp -a ../dist/linux-unpacked/. "$bundle/x64/"
          cp -a ../dist/linux-arm64-unpacked/. "$bundle/arm64/"
          cp linux/launch.sh linux/Velron-Installer.desktop README.md ../LICENSE "$bundle/"
          chmod 755 "$bundle/launch.sh" "$bundle/Velron-Installer.desktop"
          tar -czf ../dist/Velron-Installer-linux.tar.gz -C ../build 'Velron Installer'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-checks-linux
          path: installer/test-results/

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Publish dedicated installer assets
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const { owner, repo } = context.repo;
            const tag = 'installer-latest';
            const files = [
              'Velron-Installer-windows-x64.exe',
              'Velron-Installer-windows-arm64.exe',
              'Velron-Installer-macos-universal.zip',
              'Velron-Installer-linux.tar.gz',
            ];
            const sums = files.map(name => {
              const data = fs.readFileSync(`dist/${name}`);
              if (!data.length) throw new Error(`Empty artifact: ${name}`);
              return `${crypto.createHash('sha256').update(data).digest('hex')}  ${name}`;
            }).join('\n') + '\n';
            fs.writeFileSync('dist/SHA256SUMS-installers.txt', sums);
            files.push('SHA256SUMS-installers.txt');
            const body = [
              'Install Velron in a consistent desktop GUI on Windows, macOS, and Linux.',
              'The GUI uses the bundled One-line install engine and downloads verified Server and Client binaries.',
              '',
              '- Windows: open the x64 or ARM64 executable for your PC.',
              '- macOS: extract the ZIP, then open Velron Installer.app. No Terminal access is needed.',
              '- Linux: extract the archive, then open Velron-Installer.desktop (allow launching if asked).',
              '',
              'Windows and macOS launchers do not have a trusted publisher signature. Your OS may request approval.',
              'The regular application release remains available at /releases/latest.',
              '',
              `Source: ${context.sha}`,
            ].join('\n');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              release = (await github.rest.repos.updateRelease({
                owner, repo, release_id: release.id, name: 'Velron Installer', body,
                draft: false, prerelease: false, make_latest: 'false',
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: 'Velron Installer', body, draft: false, prerelease: false,
                make_latest: 'false',
              })).data;
            }
            const existing = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const name of files) {
              const old = existing.find(asset => asset.name === name);
              if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data: fs.readFileSync(`dist/${name}`),
              });
            }
            await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true });
            const latest = (await github.rest.repos.getLatestRelease({ owner, repo })).data;
            if (latest.tag_name === tag) throw new Error('Installer release unexpectedly replaced the latest application release.');
            core.summary.addLink('Download Velron Installer', release.html_url).write();
